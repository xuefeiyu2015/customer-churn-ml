[project]
name = "customer-churn-ml"
version = "0.1.0"
description = "A reproducible machine learning system for customer churn risk ranking under limited outreach capacity."
readme = "README.md"
authors = [
    { name = "Xuefei Yu" }
]
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip>=26.3",
    "pytest>=9.2.0",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
]
